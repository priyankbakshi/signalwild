name: Build SignalWild Investor Deck
on:
  workflow_dispatch:
  push:
    paths:
      - "build_investor_deck.py"
      - ".github/workflows/build-deck.yml"
      - "assets/signalwild-vision.webp"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet python-pptx pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress
      - name: Render editable PowerPoint and PDF
        run: |
          python build_investor_deck.py
          libreoffice -env:UserInstallation=file:///tmp/lo-signalwild --headless --convert-to pdf --outdir . SignalWild_Investor_Deck.pptx
      - name: Commit generated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SignalWild_Investor_Deck.pptx SignalWild_Investor_Deck.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh branded investor PDF and PowerPoint"
            git push
          fi
